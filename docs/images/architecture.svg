<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <rect width="820" height="560" fill="#ffffff"/>

  <!-- main column -->
  <rect x="300" y="30" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="50" text-anchor="middle" font-size="13" fill="#111827">POST /posts</text>
  <text x="410" y="66" text-anchor="middle" font-size="11" fill="#6b7280">url fetch or markdown</text>

  <path d="M410 74 L410 106" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="300" y="106" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="126" text-anchor="middle" font-size="13" fill="#111827">generator</text>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#6b7280">gemini / template fallback</text>

  <path d="M410 150 L410 182" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="300" y="182" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="202" text-anchor="middle" font-size="13" fill="#111827">validator</text>
  <text x="410" y="218" text-anchor="middle" font-size="11" fill="#6b7280">constraint profile per platform</text>

  <path d="M300 204 L206 204" stroke="#111827" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="196" y="200" text-anchor="end" font-size="11" fill="#6b7280">rejected</text>
  <text x="196" y="214" text-anchor="end" font-size="11" fill="#6b7280">before review</text>

  <path d="M410 226 L410 258" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="300" y="258" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="278" text-anchor="middle" font-size="13" fill="#111827">review</text>
  <text x="410" y="294" text-anchor="middle" font-size="11" fill="#6b7280">draft / approved / rejected</text>

  <path d="M520 280 L614 280" stroke="#111827" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="624" y="276" font-size="11" fill="#6b7280">unapproved</text>
  <text x="624" y="290" font-size="11" fill="#6b7280">schedule = 409</text>

  <path d="M410 302 L410 334" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="420" y="322" font-size="11" fill="#6b7280">approved only</text>

  <rect x="300" y="334" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="354" text-anchor="middle" font-size="13" fill="#111827">scheduler</text>
  <text x="410" y="370" text-anchor="middle" font-size="11" fill="#6b7280">polls every 30s, persistent store</text>

  <path d="M410 378 L410 410" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="300" y="410" width="220" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="410" y="430" text-anchor="middle" font-size="13" fill="#111827">publish service</text>
  <text x="410" y="446" text-anchor="middle" font-size="11" fill="#6b7280">idempotency key, UNIQUE</text>

  <path d="M520 432 L614 432" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="620" y="410" width="170" height="44" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="705" y="430" text-anchor="middle" font-size="13" fill="#111827">publish_attempts</text>
  <text x="705" y="446" text-anchor="middle" font-size="11" fill="#6b7280">history, one slot one post</text>

  <path d="M410 454 L410 478" stroke="#111827" stroke-width="1.2"/>
  <path d="M150 478 L670 478" stroke="#111827" stroke-width="1.2"/>
  <path d="M150 478 L150 502" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M410 478 L410 502" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M670 478 L670 502" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="410" y="472" text-anchor="middle" font-size="11" fill="#6b7280">SocialPublisher</text>

  <rect x="60" y="502" width="180" height="40" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="150" y="521" text-anchor="middle" font-size="13" fill="#111827">DiscordPublisher</text>
  <text x="150" y="536" text-anchor="middle" font-size="11" fill="#6b7280">real webhook</text>

  <rect x="320" y="502" width="180" height="40" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="410" y="521" text-anchor="middle" font-size="13" fill="#374151">MockXPublisher</text>
  <text x="410" y="536" text-anchor="middle" font-size="11" fill="#9ca3af">writes to db</text>

  <rect x="580" y="502" width="180" height="40" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="670" y="521" text-anchor="middle" font-size="13" fill="#374151">MockLinkedInPublisher</text>
  <text x="670" y="536" text-anchor="middle" font-size="11" fill="#9ca3af">writes to db</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
